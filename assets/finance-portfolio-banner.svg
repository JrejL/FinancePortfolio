<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Finance Portfolio, George Murad, Financial Analyst">
  <title>Finance Portfolio, George Murad, Financial Analyst</title>
  <style>
    .bg { fill: #141413; }
    .grid { stroke: #faf9f5; stroke-opacity: .07; stroke-width: 1; }
    .eyebrow { font: 600 15px Poppins, "Helvetica Neue", Arial, sans-serif; fill: #d97757; letter-spacing: 3px; }
    .h { font: 700 64px Poppins, "Helvetica Neue", Arial, sans-serif; fill: #faf9f5; letter-spacing: -1.5px; }
    .s { font: italic 400 22px Lora, Georgia, "Times New Roman", serif; fill: #b0aea5; }
    .t { font: 400 18px Lora, Georgia, "Times New Roman", serif; fill: #b0aea5; }
    .axis { stroke: #faf9f5; stroke-opacity: .5; stroke-width: 2; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 8s cubic-bezier(.22,.61,.36,1) infinite both; }
    .b2 { animation-delay: .12s } .b3 { animation-delay: .24s } .b4 { animation-delay: .36s } .b5 { animation-delay: .48s } .b6 { animation-delay: .6s }
    .line { fill: none; stroke: #faf9f5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 8s ease infinite both; }
    .dot { fill: #d97757; transform-box: fill-box; transform-origin: 50% 50%; animation: pop 8s ease infinite both; }
    @keyframes grow { 0% { transform: scaleY(0); opacity: 1 } 16% { transform: scaleY(1) } 88% { transform: scaleY(1); opacity: 1 } 96% { opacity: 0 } 100% { transform: scaleY(0); opacity: 0 } }
    @keyframes draw { 0%, 14% { stroke-dashoffset: 520; opacity: 1 } 36% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 96%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes pop { 0%, 34% { transform: scale(0); opacity: 0 } 40% { transform: scale(1.3); opacity: 1 } 45%, 88% { transform: scale(1); opacity: 1 } 96%, 100% { transform: scale(1); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .line, .dot { animation: none; }
      .line { stroke-dashoffset: 0; }
    }
  </style>
  <rect class="bg" width="1200" height="300"/>
  <g class="grid">
    <path d="M740 40V260M800 40V260M860 40V260M920 40V260M980 40V260M1040 40V260M1100 40V260"/>
    <path d="M720 60H1120M720 110H1120M720 160H1120M720 210H1120"/>
  </g>
  <text class="eyebrow" x="62" y="86">FINANCE PORTFOLIO</text>
  <text class="h" x="58" y="152">George Murad</text>
  <text class="s" x="62" y="192">Financial Analyst</text>
  <text class="t" x="62" y="236">Six practice case studies, four Python analyses</text>
  <text class="t" x="62" y="262">and the books of my own business.</text>
  <g>
    <rect class="bar b1" x="740" y="190" width="40" height="70" fill="#6a9bcc"/>
    <rect class="bar b2" x="804" y="164" width="40" height="96" fill="#788c5d"/>
    <rect class="bar b3" x="868" y="150" width="40" height="110" fill="#6a9bcc"/>
    <rect class="bar b4" x="932" y="124" width="40" height="136" fill="#788c5d"/>
    <rect class="bar b5" x="996" y="100" width="40" height="160" fill="#6a9bcc"/>
    <rect class="bar b6" x="1060" y="66" width="40" height="194" fill="#d97757"/>
  </g>
  <line class="axis" x1="730" y1="260" x2="1120" y2="260"/>
  <path class="line" d="M760 176 L824 150 L888 136 L952 110 L1016 86 L1080 52"/>
  <circle class="dot" cx="1080" cy="52" r="7"/>
</svg>
